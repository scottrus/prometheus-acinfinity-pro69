[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-acinfinity-pro69"
# Derived from the git tag by setuptools-scm and never committed, so no commit
# has to predict the next release number. A local tree gets a dev version such
# as 0.1.0.dev3+g9e3b566; the release workflow passes the tag in through
# SETUPTOOLS_SCM_PRETEND_VERSION. Same pattern as ecobee-runtime-importer.
dynamic = ["version"]
description = "Prometheus exporter for the AC Infinity UIS Controller 69 PRO, read from the vendor cloud API, with a one-shot history backfill into VictoriaMetrics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Scott Russell" }]
keywords = ["prometheus", "exporter", "ac-infinity", "cloudline", "uis", "monitoring", "victoriametrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
# One runtime dependency, on purpose. The vendor API is four form POSTs over
# HTTPS, and the standard library handles them. Every extra package is CVE
# surface inside a runtime image that ships nothing else.
dependencies = [
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
acinfinity-exporter = "acinfinity_exporter.__main__:main"
acinfinity-backfill = "acinfinity_exporter.backfill:main"

[project.urls]
Homepage = "https://github.com/scottrus/prometheus-acinfinity-pro69"
Issues = "https://github.com/scottrus/prometheus-acinfinity-pro69/issues"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
