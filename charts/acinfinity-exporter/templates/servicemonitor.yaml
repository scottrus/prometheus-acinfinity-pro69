{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "acinfinity.fullname" . }}
  labels:
    {{- include "acinfinity.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "acinfinity.selectorLabels" . | nindent 6 }}
  endpoints:
    {{/* Scrape interval is unrelated to the vendor call rate: a scrape reads
         process state. pollInterval is the only thing that reaches the vendor. */}}
    - port: http-metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
