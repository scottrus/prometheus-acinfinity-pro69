apiVersion: v1
kind: Service
metadata:
  name: {{ include "acinfinity.fullname" . }}
  labels: {{- include "acinfinity.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-metrics
      port: {{ .Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
  selector: {{- include "acinfinity.selectorLabels" . | nindent 4 }}
